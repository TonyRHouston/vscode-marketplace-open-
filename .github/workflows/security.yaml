name: security
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      with:
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
      with:
        go-version-file: go.mod
    - name: Initialize CodeQL
      uses: github/codeql-action/init@19b2f06db2b6f5108140aeb04014ef02b648f789
      with:
        languages: go
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@19b2f06db2b6f5108140aeb04014ef02b648f789
      with:
        category: /language:go
  trivy:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      with:
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
      with:
        go-version-file: go.mod
    - name: Build binary for linux/amd64
      run: make bin/code-marketplace-linux-amd64
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
    - name: Build Docker image
      id: build
      run: "docker buildx bake \\\n  -f ./docker-bake.hcl \\\n  --set \"*.platform=linux/amd64\"\
        \ \\\n  --set \"*.tags=code-marketplace:scan\" \\\n  --load\necho \"image=code-marketplace:scan\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Run Trivy vulnerability scanner (table output for logs)
      uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
      with:
        image-ref: ${{ steps.build.outputs.image }}
        format: table
        severity: LOW,MEDIUM,HIGH,CRITICAL
    - name: Run Trivy vulnerability scanner (SARIF output for GitHub)
      uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
      with:
        image-ref: ${{ steps.build.outputs.image }}
        format: sarif
        output: trivy-results.sarif
        severity: LOW,MEDIUM,HIGH,CRITICAL
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@19b2f06db2b6f5108140aeb04014ef02b648f789
      with:
        sarif_file: trivy-results.sarif
        category: Trivy
    - name: Upload Trivy scan results as artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: trivy-results
        path: trivy-results.sarif
        retention-days: 7
